name: Check
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python and JavaScript syntax
        run: |
          python -m py_compile thermal_web.py
          node --check static/app.js
      - name: Install sensor driver dependencies
        run: pip install -r requirements.txt
